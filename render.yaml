services:
  - type: worker
    name: taskstars-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: taskstars-db
          property: connectionString

databases:
  - name: taskstars-db
    plan: free
