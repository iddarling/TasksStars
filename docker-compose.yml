version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taskstars_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot_password}
      POSTGRES_DB: ${POSTGRES_DB:-taskstars}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d taskstars"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: taskstars_bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bot_user:bot_password@db:5432/taskstars
    volumes:
      - .:/app

volumes:
  postgres_data:
